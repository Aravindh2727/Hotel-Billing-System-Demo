<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Store the path that caused the 404
      sessionStorage.redirect = window.location.pathname + window.location.search;
      // Adaptively redirect to the proper base path (GitHub Pages or Custom Domain / Vercel / Netlify)
      var base = window.location.pathname.startsWith('/billing-system1') ? '/billing-system1/' : '/';
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
